<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
     <header class="header">
      <a href="/">
        <img
          class="logo"
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>
      <nav class="navigation">
        <ul class="items">
          <li class="list">
            <a
              class="link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              data-qa="hover"
              href="#"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="list">
            <a
              class="link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
     <div
      class="card"
      data-qa="card"
    >
      <img
        class="card__image"
        src="../src/images/imac.jpeg"
        alt="Mac"
      />

      <h2 class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>

      <p class="card__code">Product code: 195434</p>

      <div class="card__rating">
        <div class="stars stars--4">
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
        </div>

        <p class="card__reviews">Reviews: 5</p>
      </div>

      <div class="card__price">
        <span class="card__price-label">Price:</span>
        <span class="card__price-value">$2,199</span>
      </div>

      <a
        href="#"
        class="card__buy"
        data-qa="hover"
      >
        BUY
      </a>
    </div>
  </body>
</html>
